name: Android · Play

# Build the signed Android App Bundle and stage it on BOTH closed-testing tracks
# ("alpha" + the custom "Google Group - Alpha") on a version tag (v*) — the
# Android counterpart to ios.yml (which ships the iOS build to TestFlight, the
# iOS closed-testing equivalent). A manual workflow_dispatch stages on a single
# chosen track instead — with promote_version_code set it skips the build and
# assigns that ALREADY-UPLOADED build to the track (Play rejects re-uploading
# a versionCode, so a closed→production cutover of the same build must
# promote, not rebuild). Reuses the local
# release tooling: the upload keystore for signing + tool/play_upload_aab.py
# (service account) for the upload, exactly as documented in CLAUDE.md.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64      base64 of the upload keystore (.jks)        — from the BACKED-UP keystore
#   ANDROID_KEY_ALIAS            key alias inside the keystore               — from local android/key.properties
#   ANDROID_KEY_PASSWORD         password for that key                       — from local android/key.properties
#   ANDROID_STORE_PASSWORD       password for the keystore                   — from local android/key.properties
#   PLAY_STORE_KEY_JSON_BASE64   base64 of fastlane/play-store-key.json      — the Play service-account key
#
# Make a base64 secret with:  base64 -w0 <file>   (macOS: base64 -i <file>)
# Without these the build still runs but falls back to the DEBUG signing key,
# which Play rejects on upload — so all five are mandatory for the upload to land.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to stage the release on (manual run only)"
        default: "alpha"
        type: choice
        options: ["alpha", "Google Group - Alpha", internal, beta, production]
      promote_version_code:
        description: "Promote this already-uploaded versionCode to the track instead of building (e.g. 38)"
        default: ""
        type: string

jobs:
  # Same analyze + test suite as test.yml: a v* tag on a red or never-tested
  # commit must not reach the Play tracks.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  play:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # A manual dispatch to the production track is a full public rollout
    # (status: completed) — bind it to the protected `play-production`
    # environment, whose required-reviewer rule holds the job until approved
    # in the GitHub UI. Every other path (tag pushes to closed testing,
    # manual closed-track staging) runs unguarded as before.
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.track == 'production' && 'play-production' || '' }}
    # Serialize Play uploads: concurrent runs would race independent edits
    # against the same app. Queue, never cancel, a release in flight.
    concurrency:
      group: play-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches pubspec version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PUBSPEC=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          if [ "${TAG#v}" != "${PUBSPEC%%+*}" ]; then
            echo "::error::Tag $TAG does not match pubspec.yaml version: $PUBSPEC — bump pubspec (and the four changelogs) before tagging."
            exit 1
          fi

      # Promote runs (promote_version_code set) skip everything build-related:
      # no Java/Flutter/keystore/AAB — only the service-account key install
      # and the track assignment below.
      - uses: actions/setup-java@v5
        if: github.event.inputs.promote_version_code == ''
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: github.event.inputs.promote_version_code == ''
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Flutter pub get
        if: github.event.inputs.promote_version_code == ''
        run: flutter pub get

      - name: Install signing keystore & key.properties
        if: github.event.inputs.promote_version_code == ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty — release would sign with the debug key and Play would reject it."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          # storeFile is read via Gradle file(...) — an absolute path resolves as-is.
          cat > android/key.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Install Play service-account key
        env:
          PLAY_STORE_KEY_JSON_BASE64: ${{ secrets.PLAY_STORE_KEY_JSON_BASE64 }}
        run: |
          if [ -z "$PLAY_STORE_KEY_JSON_BASE64" ]; then
            echo "::error::PLAY_STORE_KEY_JSON_BASE64 is empty — the upload would fail with an auth traceback only after the ~10-minute build."
            exit 1
          fi
          mkdir -p fastlane
          echo "$PLAY_STORE_KEY_JSON_BASE64" | base64 --decode > fastlane/play-store-key.json

      - name: Build release App Bundle
        if: github.event.inputs.promote_version_code == ''
        run: flutter build appbundle --release

      - name: Upload to Play
        env:
          DISPATCH_TRACK: ${{ github.event.inputs.track }}
          PROMOTE_VC: ${{ github.event.inputs.promote_version_code }}
        run: |
          python3 -m pip install --quiet google-api-python-client google-auth
          if [ -n "$PROMOTE_VC" ]; then
            # Manual promote: assign the existing build to the chosen track.
            python3 tool/play_upload_aab.py --promote "$PROMOTE_VC" "$DISPATCH_TRACK"
          elif [ -n "$DISPATCH_TRACK" ]; then
            # Manual run: stage on the chosen track only.
            python3 tool/play_upload_aab.py "$DISPATCH_TRACK"
          else
            # Tag push (v*): stage on BOTH closed-testing tracks.
            python3 tool/play_upload_aab.py "alpha" "Google Group - Alpha"
          fi
